name: Publish Ultra Exif Reader v4.12
on:
  push:
    branches: [main]
    paths:
      - 'Ultra_exif_reader_v4.12.html'
      - '.github/workflows/release-v4.12.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Verify package and build release ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          html = Path('Ultra_exif_reader_v4.12.html')
          manual = Path('manual.txt')
          assert html.is_file() and manual.is_file()
          assert '<title>Ultra Exif Reader v4.12</title>' in html.read_text(encoding='utf-8')
          assert '<span class="title-badge">v4.12</span>' in html.read_text(encoding='utf-8')
          assert 'Ultra Exif Reader v4.12' in manual.read_text(encoding='utf-8-sig')
          with ZipFile('Ultra_exif_reader_v4.12.zip', 'w', compression=ZIP_DEFLATED, compresslevel=9) as z:
              z.write(html, arcname='Ultra_exif_reader_v4.12.html')
              z.write(manual, arcname='메뉴얼.txt')
          with ZipFile('Ultra_exif_reader_v4.12.zip') as z:
              assert z.testzip() is None
              assert z.namelist() == ['Ultra_exif_reader_v4.12.html', '메뉴얼.txt']
              assert z.read('Ultra_exif_reader_v4.12.html') == html.read_bytes()
              assert z.read('메뉴얼.txt') == manual.read_bytes()
          print('v4.12 release ZIP integrity verified')
          PY
      - name: Publish v4.12 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v4.12 ./Ultra_exif_reader_v4.12.zip \
            --target "$GITHUB_SHA" \
            --title "Ultra Exif Reader v4.12" \
            --notes-file RELEASE_NOTES_v4.12.md \
            --latest
